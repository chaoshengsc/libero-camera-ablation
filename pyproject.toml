[project]
name = "robot-policy-sim-repro"
version = "1.1.0"
description = "Reproducing public checkpoints of robot policies in simulation, plus vision-dependence experiments"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E701", "E702", "E731", "E741"]  # 分析脚本里的单行写法与短变量名是有意为之

[tool.ruff.lint.per-file-ignores]
"scripts/checks/*" = ["E402"]  # 自检脚本按"先打印环境、再导入"的顺序写

[tool.ruff.lint.isort]
known-first-party = ["metrics", "analyze_trajectories"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/analysis"]
