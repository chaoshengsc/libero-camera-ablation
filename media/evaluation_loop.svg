<svg xmlns="http://www.w3.org/2000/svg" width="900" height="294" viewBox="0 0 900 294" role="img">
<title>π0/π0.5 evaluation forms an observation–action loop</title>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#253244}.muted{fill:#667085;font-size:12px}</style>
<text x="22" y="30" style="font-size:19px;font-weight:650">π0/π0.5 evaluation forms an observation–action loop</text>
<rect x="22" y="62" width="188" height="112" rx="5" fill="#f5f7fa" stroke="#d5dce5"/>
<text x="116.0" y="91" text-anchor="middle" style="font-weight:650">Current observation</text>
<text x="116.0" y="118" text-anchor="middle" class="muted">Agent + wrist images</text>
<text x="116.0" y="145" text-anchor="middle" class="muted">Robot state + instruction</text>
<rect x="236" y="62" width="190" height="112" rx="5" fill="#f5f7fa" stroke="#d5dce5"/>
<text x="331.0" y="91" text-anchor="middle" style="font-weight:650">Targeted intervention</text>
<text x="331.0" y="118" text-anchor="middle" class="muted">Target image / visual mask</text>
<text x="331.0" y="145" text-anchor="middle" class="muted">Other inputs remain live</text>
<rect x="452" y="62" width="166" height="112" rx="5" fill="#f5f7fa" stroke="#d5dce5"/>
<text x="535.0" y="91" text-anchor="middle" style="font-weight:650">Public policy checkpoint</text>
<text x="535.0" y="118" text-anchor="middle" class="muted">Predict an action chunk</text>
<text x="535.0" y="145" text-anchor="middle" class="muted">No retraining in this study</text>
<rect x="644" y="62" width="234" height="112" rx="5" fill="#f5f7fa" stroke="#d5dce5"/>
<text x="761.0" y="91" text-anchor="middle" style="font-weight:650">Execute part of the chunk</text>
<text x="761.0" y="118" text-anchor="middle" class="muted">Observe the updated environment</text>
<text x="761.0" y="145" text-anchor="middle" class="muted">Query the policy again</text>
<path d="M214 117H230m-6 -5 6 5-6 5" fill="none" stroke="#526f91" stroke-width="1.6"/>
<path d="M430 117H446m-6 -5 6 5-6 5" fill="none" stroke="#526f91" stroke-width="1.6"/>
<path d="M622 117H638m-6 -5 6 5-6 5" fill="none" stroke="#526f91" stroke-width="1.6"/>
<path d="M762 180V213H116V180m-5 7 5-7 5 7" fill="none" stroke="#526f91" stroke-width="1.6"/>
<text x="440" y="204" text-anchor="middle" class="muted">Images/state update with the environment; matched starts do not imply identical later inputs</text>
<text x="22" y="247" class="muted">π0: predict 50 actions, execute 5 before observing again; π0.5: predict 50, execute 10.</text>
<text x="22" y="271" class="muted">OpenVLA instead uses agent view + instruction and single-step actions, outside the dual-view/state path.</text>
</svg>
