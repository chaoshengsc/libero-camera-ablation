l="#26313b">17/40 (42.5%)</text><text x="30" y="475" font-size="15" text-anchor="start" fill="#26313b">任务 9 / 来源状态 0</text><path d="M552.9246995164823 470H672.0349787326596" stroke="#2563ab" stroke-width="3"/><circle cx="618.0" cy="470" r="4.5" fill="#2563ab"/><text x="950" y="475" font-size="14" text-anchor="end" fill="#26313b">26/40 (65.0%)</text><text x="30" y="578" font-size="20" text-anchor="start" fill="#26313b">262/400 = 65.5%  |  95% CI [61.0, 69.8]%</text><text x="30" y="612" font-size="12" text-anchor="start" fill="#26313b">逐任务误差线为 Wilson 区间；总体为任务内目标状态分层 bootstrap 区间。</text><text x="30" y="637" font-size="12" text-anchor="start" fill="#26313b">目标状态未参与动作选择，但不是隐藏测试集；底层控制器仍有反馈。</text><text x="30" y="662" font-size="12" text-anchor="start" fill="#26313b">固定动作基线不识别 LeRobot π0 的内部机制，不能与其全黑成功率相减归因。</text></svg>
