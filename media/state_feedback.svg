<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect width="1000" height="460" fill="white"/><text x="30" y="36" font-size="23" text-anchor="start" fill="#26313b">State-input update sensitivity | LeRobot pi0 v044</text><text x="30" y="64" font-size="13" text-anchor="start" fill="#26313b">100 initial states, three repeats; four conditions paired within each repeat</text><path d="M350.0 85V275" stroke="#e0e5e9"/><text x="350.0" y="296" font-size="12" text-anchor="middle" fill="#26313b">0%</text><path d="M440.0 85V275" stroke="#e0e5e9"/><text x="440.0" y="296" font-size="12" text-anchor="middle" fill="#26313b">20%</text><path d="M530.0 85V275" stroke="#e0e5e9"/><text x="530.0" y="296" font-size="12" text-anchor="middle" fill="#26313b">40%</text><path d="M620.0 85V275" stroke="#e0e5e9"/><text x="620.0" y="296" font-size="12" text-anchor="middle" fill="#26313b">60%</text><path d="M710.0 85V275" stroke="#e0e5e9"/><text x="710.0" y="296" font-size="12" text-anchor="middle" fill="#26313b">80%</text><path d="M800.0 85V275" stroke="#e0e5e9"/><text x="800.0" y="296" font-size="12" text-anchor="middle" fill="#26313b">100%</text><text x="30" y="115" font-size="15" text-anchor="start" fill="#26313b">A  Normal images / live state</text><circle cx="674.0" cy="105" r="3.5" fill="#2563ab"/><circle cx="674.0" cy="110" r="3.5" fill="#2563ab"/><circle cx="692.0" cy="115" r="3.5" fill="#2563ab"/><text x="950" y="115" font-size="16" text-anchor="end" fill="#26313b">73.3%</text><text x="30" y="163" font-size="15" text-anchor="start" fill="#26313b">B  Black images / live state</text><circle cx="593.0" cy="153" r="3.5" fill="#bc5428"/><circle cx="593.0" cy="158" r="3.5" fill="#bc5428"/><circle cx="611.0" cy="163" r="3.5" fill="#bc5428"/><text x="950" y="163" font-size="16" text-anchor="end" fill="#26313b">55.3%</text><text x="30" y="211" font-size="15" text-anchor="start" fill="#26313b">C  Normal images / frozen state</text><circle cx="350.0" cy="201" r="3.5" fill="#2563ab"/><circle cx="350.0" cy="206" r="3.5" fill="#2563ab"/><circle cx="350.0" cy="211" r="3.5" fill="#2563ab"/><text x="950" y="211" font-size="16" text-anchor="end" fill="#26313b">0.0%</text><text x="30" y="259" font-size="15" text-anchor="start" fill="#26313b">D  Black images / frozen state</text><circle cx="350.0" cy="249" r="3.5" fill="#bc5428"/><circle cx="350.0" cy="254" r="3.5" fill="#bc5428"/><circle cx="350.0" cy="259" r="3.5" fill="#bc5428"/><text x="950" y="259" font-size="16" text-anchor="end" fill="#26313b">0.0%</text><text x="30" y="340" font-size="17" text-anchor="start" fill="#26313b">Black images: live minus frozen state</text><text x="30" y="371" font-size="18" text-anchor="start" fill="#26313b">55.3 pp  [95% CI 50.0, 60.3]</text><text x="30" y="410" font-size="12" text-anchor="start" fill="#26313b">Dots are three runs; right-hand labels are means. Repeats are not independent states.</text><text x="30" y="435" font-size="12" text-anchor="start" fill="#26313b">Intervals group repeats by initial state within ten fixed tasks; the mechanism remains unresolved.</text></svg>
