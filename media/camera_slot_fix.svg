<svg xmlns="http://www.w3.org/2000/svg" width="900" height="304" viewBox="0 0 900 304" role="img">
<title>Preserving camera slots prevents wrist images entering the agent-view slot</title>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;fill:#253244}.muted{fill:#667085;font-size:12px}</style>
<text x="22" y="30" style="font-size:19px;font-weight:650">Preserving camera slots prevents wrist images entering the agent-view slot</text>
<text x="300" y="68" text-anchor="middle" class="muted">Slot 0 · agent</text>
<text x="515" y="68" text-anchor="middle" class="muted">Slot 1 · wrist</text>
<text x="730" y="68" text-anchor="middle" class="muted">Slot 2 · reserved empty</text>
<text x="22" y="113">Normal input</text>
<rect x="202" y="86" width="196" height="40" rx="4" fill="#f6f7f9" stroke="#d5dce5"/>
<text x="300" y="112" text-anchor="middle">Agent image</text>
<rect x="417" y="86" width="196" height="40" rx="4" fill="#f6f7f9" stroke="#d5dce5"/>
<text x="515" y="112" text-anchor="middle">Wrist image</text>
<rect x="632" y="86" width="196" height="40" rx="4" fill="#f6f7f9" stroke="#d5dce5"/>
<text x="730" y="112" text-anchor="middle">Empty</text>
<text x="22" y="171">Agent missing · before</text>
<rect x="202" y="144" width="196" height="40" rx="4" fill="#fff0eb" stroke="#c86a4b"/>
<text x="300" y="170" text-anchor="middle">Wrist image (shifted)</text>
<rect x="417" y="144" width="196" height="40" rx="4" fill="#f6f7f9" stroke="#d5dce5"/>
<text x="515" y="170" text-anchor="middle">Empty</text>
<rect x="632" y="144" width="196" height="40" rx="4" fill="#f6f7f9" stroke="#d5dce5"/>
<text x="730" y="170" text-anchor="middle">Empty</text>
<text x="22" y="229">Agent missing · after</text>
<rect x="202" y="202" width="196" height="40" rx="4" fill="#f6f7f9" stroke="#d5dce5"/>
<text x="300" y="228" text-anchor="middle">Empty</text>
<rect x="417" y="202" width="196" height="40" rx="4" fill="#edf4fb" stroke="#547da6"/>
<text x="515" y="228" text-anchor="middle">Wrist image (in place)</text>
<rect x="632" y="202" width="196" height="40" rx="4" fill="#f6f7f9" stroke="#d5dce5"/>
<text x="730" y="228" text-anchor="middle">Empty</text>
<text x="22" y="280" class="muted">Example: π0.5 v044 three-slot layout. The six-policy fix preserves each policy’s placeholder and empty-camera contract.</text>
</svg>
