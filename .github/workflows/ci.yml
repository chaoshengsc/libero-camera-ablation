name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9 pytest numpy
      - name: Lint
        run: ruff check .
      - name: Shell syntax
        run: for f in scripts/*.sh scripts/*/*.sh; do bash -n "$f"; done
      - name: Tests
        run: pytest -q
      - name: Documentation, JavaScript and citation consistency
        run: python scripts/checks/repository_check.py
      - name: Frozen protocol evidence and deadline counts
        run: python scripts/analysis/summarize_protocol_audit.py
      - name: Dashboard data and figures are up to date
        run: |
          python dashboard/build.py
          python scripts/analysis/make_figures.py
          python scripts/analysis/summarize_followup.py
          git status --porcelain -- dashboard/results.js dashboard/followup.js results media
          test -z "$(git status --porcelain -- dashboard/results.js dashboard/followup.js results media)"
